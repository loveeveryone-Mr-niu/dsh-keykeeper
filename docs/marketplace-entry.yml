# 复制到 awesome-dsh-plugin 仓库：data/plugins/<你的GitHub用户名>__dsh-keykeeper.yml
# 文件名必须与 url 的 slug 一致；只加这一个文件，不要改 README（README 由脚本生成）。
# 把 <owner> 换成你的 GitHub 用户名或组织名，两处都要换。
url: https://github.com/<owner>/dsh-keykeeper
name: <owner>/dsh-keykeeper
category: usage
description:
  en: 'Encrypted local vault for model API keys: import keys.txt, check provider balances and subscription quotas, write providers into DSH with one click, and open official top-up pages.'
  zh: 加密保存各家模型 API Key，查看余额与订阅额度，一键写入 DSH 模型配置，并跳转官方充值页。

# 可选字段（按需取消注释）：
# icon: https://raw.githubusercontent.com/<owner>/dsh-keykeeper/main/assets/icon-180.png
#   —— 必须是 GitHub 托管的位图（png/jpg/jpeg/webp），SVG 会被拒；不写则显示你的 GitHub 头像。
# tarball: https://github.com/<owner>/dsh-keykeeper/releases/download/v0.2.2/dsh-keykeeper-0.2.2.tgz
#   —— 仅当仓库无法从源码安装时必填；能源码安装可省略。
